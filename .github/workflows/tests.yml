# Runs the audit's own test suite against a fresh glibc clone.
#
# Why a fresh clone rather than a cached one: the suite pins each tag to the
# commit it must resolve to (tests/_harness.py, EXPECTED_SHA). That is what
# makes cloning fresh safe -- a moved tag or a mirror serving different content
# fails as "the tag moved", with a message saying not to read the other
# mismatches as a code regression. Without that pin, a fresh clone would turn
# any upstream change into an ambiguous red build, and ambiguous red builds get
# ignored.
name: tests

on:
  # `push` unfiltered plus `pull_request` ran this job TWICE for every pull
  # request -- two identical runs of the same commit, measured on
  # #51 and #52. A branch that is not main reaches GitHub as a PR, and the
  # pull_request event tests the merge result, which is the thing being
  # merged; the push event only added a second opinion about the branch head.
  #
  # What this gives up, stated rather than discovered: a branch pushed with no
  # PR open gets no CI. Nothing reaches GitHub untested even so -- the local
  # gate (.claude/, private) runs the full suite before every push -- and the
  # moment such a branch becomes a PR, this job runs on it.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    # 75, not 20, 30 or 45: the first run after a change to the reader
    # computes its answers from nothing, and a run that times out saves no
    # cache, so every run after it would start from nothing too. The first
    # run of #103 was cancelled at 20 minutes; with step 2 reading through
    # the reader, three such runs took 20 to 26 minutes (backlog 15.2 B3).
    # Step 9.1 keeps a sha1 of each line's statements too: its fill from
    # nothing alone took 42.5 minutes, and the run was cancelled at 45.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The scripts are stdlib-only by design (docs/requirements.md). Nothing
      # is installed here on purpose: if this job ever needs a pip install, the
      # promise broke and the job should be what says so.

      - name: Clone glibc
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/bminor/glibc.git scripts/glibc
          git -C scripts/glibc fetch --tags --quiet

      - name: Fetch the files the reader reads, in one request
        # On this partial clone git fetches each blob it is asked for one at
        # a time. The comparison of run() with every locale file of the five
        # tags reads about 1,400 of them, and that took 98 to 259 s per tag
        # (measured from the Mac, #102), against 2 s for this one request. A
        # whole clone answers too, but cost 58 s against 7 s here. The tags
        # are the suite's own; the paths are what glibc_reader reads, and
        # what step 2 reads besides (SUPPORTED, the charmaps and
        # locale.alias): a repository
        # _harness.glibc_commit makes on top of a tag shares
        # this clone's objects and cannot fetch one this clone lacks, so a
        # test of step 2 there read them only if an earlier class had.
        # test_build_sources reads the whole of localedata/ and locale/ at
        # the three tags of the published pairs (scope_from_git): 743 blobs
        # more, 17.5 MB, in the same request. version.h is what
        # glibc_locale_data.side_glibc_version reads of every tag side, in
        # a test's own repository too, which cannot fetch it.
        run: |
          tags=$(cd tests && python3 -c "import _harness as h; print(h.FLOOR_OLD, h.FLOOR_NEW, h.OLD, h.MID, h.NEW)")
          three=$(cd tests && python3 -c "import _harness as h; print(h.OLD, h.MID, h.NEW)")
          oids=$({ for t in $tags; do git -C scripts/glibc ls-tree -r "$t" localedata/locales locale/programs/locfile-kw.gperf locale/programs/charmap-kw.gperf localedata/SUPPORTED localedata/charmaps intl/locale.alias version.h; done; for t in $three; do git -C scripts/glibc ls-tree -r "$t" localedata locale; done; } | awk '{print $3}' | sort -u)
          git -C scripts/glibc -c fetch.negotiationAlgorithm=noop fetch --quiet --no-tags --no-write-fetch-head origin $oids

      - name: Report tag provenance
        # Printed before anything else, and kept in the log: these are the
        # commit ids the run actually read. An invalid signature aborts here.
        run: |
          python3 scripts/glibc_locale_data.py provenance \
            glibc-2.28 glibc-2.34 glibc-2.39 glibc-2.12 glibc-2.17

      - name: Keep the reader's answers between runs
        # scripts/reader_cache.py keeps the localedef runs that
        # glibc_reader.py emulates for it, about 0.2 s of work per locale.
        # Unlike the clone above, what is kept here cannot answer for
        # anything but what it was computed from: each run is used only for
        # the same bytes of every file it read, and the directory names a
        # hash of the reader's own source, so a changed reader finds nothing
        # and starts over. The key below says the same, so a run after such
        # a change restores nothing instead of a cache it would throw away.
        # What glibc_tree.py derives from the runs is kept under the hash of
        # that file and of glibc_locale_data.py, whose shown() writes the
        # names it keeps; the key names them too, and falls back to the runs
        # of the same reader, so after a change to those files alone one run
        # computes it again and saves it, instead of every run computing it
        # and none saving it (backlog 15.2 B3). The step below also fills
        # what step 2 asks over the fixture builds of tests/build_sources/;
        # the key names those files, the test code that builds them and asks
        # (_harness.py, test_build_sources.py) and the scripts that decide
        # what step 2 asks of a build (node_charmaps.py holds part of step
        # 2's check of character sets), so a change to any of them is saved
        # once instead of computed on every run (#145 changed three of them).
        uses: actions/cache@v4
        with:
          path: scripts/glibc-reader-cache
          key: glibc-reader-${{ hashFiles('scripts/glibc_reader.py', 'scripts/reader_cache.py') }}-${{ hashFiles('scripts/glibc_tree.py', 'scripts/filter_lc_collate_changes.py', 'scripts/node_charmaps.py', 'scripts/glibc_locale_data.py', 'scripts/build_sources.py', 'tests/_harness.py', 'tests/test_build_sources.py', 'tests/build_sources/**') }}
          restore-keys: glibc-reader-${{ hashFiles('scripts/glibc_reader.py', 'scripts/reader_cache.py') }}

      - name: Fill the reader's answers before the suite
        # tests/run_parallel.py does the same before its classes, under its
        # 600 s limit per process. Here, after a change to the reader, it
        # ran past that (#103's first run), and the classes then computed
        # the trees one processor each. As a step of its own it has no such
        # limit and all four processors. With the cache full it still runs
        # step 2 over the fixture builds, about 12 s on the Mac, and the
        # runner then finds every tree kept.
        run: |
          cd tests
          PG_GLIBC_READER_JOBS=$(nproc) python3 -c \
            "import _harness; _harness.fill_reader_cache()"

      - name: Say so if the documentation layer is switched off
        # Renaming that file out of `test*.py` removes its tests from the run
        # without producing a single skip, so the step below stays green and
        # says nothing. A disabled layer must be visible in the log it is
        # missing from.
        run: |
          if [ -e tests/DISABLED_published_claims.py ]; then
            echo "::warning::the published-claims layer is DISABLED; nothing in this run checked the numbers and quotes the documentation publishes"
          fi

      - name: Run the suite
        # Run once, then check the summary. A skipped layer is not a passing
        # layer: without a usable glibc clone the git-backed tests skip BY
        # DESIGN, which is right on a contributor's laptop and wrong here -- a
        # broken clone step would otherwise leave this job green with only the
        # clone-free layers (test_pure_functions, test_parallel_runner,
        # test_locale_order, test_confirm_sql, and test_published_claims when
        # it is enabled) and
        # the classes of test_git_helpers, test_glibc_reader, test_build_sources
        # and test_provenance that need no clone having actually run.
        #
        # Spread over four processes, one per processor of this runner, by
        # tests/run_parallel.py, on a pull request and on main alike. They are
        # the same tests in the same files, so spreading them changes how long
        # the run takes, not what it checks. The step above has computed
        # the reader's answers for the five tags already, so the runner's own
        # fill (_harness.fill_reader_cache) finds them kept: after a change
        # to the reader, classes that each computed nearly the same tree at
        # once, one processor each, took this job past 20 minutes (measured
        # on 2026-10-14, backlog 15.2).
        run: |
          set -o pipefail
          python3 tests/run_parallel.py -j 4 2>&1 | tee /tmp/out.txt
          if grep -q 'skipped=' /tmp/out.txt; then
            echo "::error::tests were SKIPPED in CI: the glibc clone is unusable, so the published results were never checked"
            exit 1
          fi
